<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 · 页面不存在</title>
<meta name="color-scheme" content="light">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{--bg:#fcfcfb;--fg:#18181b;--muted:#76767e;--line:#e8e8e4;--accent:#1d4ed8;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 var(--sans);
    -webkit-font-smoothing:antialiased;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .box{max-width:34rem;padding:40px 22px;text-align:center}
  h1{margin:0 0 6px;font-size:2.6rem;font-weight:600;letter-spacing:.02em}
  p{margin:0 0 22px;color:var(--muted)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  nav{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:.95rem}
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>这个地址没有对应的页面，可能是链接过期或路径拼错了。</p>
    <nav>
      <a href="/">← 返回导航页</a>
      <a href="/archive/">旧版主页留档</a>
    </nav>
  </div>
</body>
</html>
